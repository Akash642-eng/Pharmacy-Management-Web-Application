apiVersion: batch/v1
kind: Job
metadata:
  name: phase20-kubernetes-job-smoke
  namespace: maruti-pharmacy
  labels:
    app.kubernetes.io/part-of: maruti-pharmacy
    phase: "20"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: phase20-kubernetes-job-smoke
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Phase 20 Kubernetes Job started"
              echo "Execution time (UTC):"
              date -u
              echo "Phase 20 Kubernetes Job completed successfully"
