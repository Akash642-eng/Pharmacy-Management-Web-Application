{% extends "base.html" %}
{% block content %}

<div class="container mt-5 text-center">

  <h2 class="text-danger mb-3">❌ Payment Failed</h2>

  <p class="text-muted">
    Your payment could not be completed.<br>
    No money has been deducted.
  </p>

  <div class="card mx-auto mt-4" style="max-width: 400px;">
    <div class="card-body">
      <p><strong>Order ID:</strong> {{ order.id }}</p>
      <p><strong>Amount:</strong> ₹ {{ order.total_amount }}</p>
      <p><strong>Status:</strong> {{ order.payment_status|upper }}</p>
    </div>
  </div>

  <div class="mt-4">
    <a href="{{ url_for('orders.checkout') }}" class="btn btn-primary btn-lg">
      Try Again
    </a>

    <a href="{{ url_for('products.products_page') }}" class="btn btn-outline-secondary ms-2">
      Continue Shopping
    </a>
  </div>

</div>

{% endblock %}
