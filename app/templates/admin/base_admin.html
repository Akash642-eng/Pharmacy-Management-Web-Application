<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel – Maruti Pharmacy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/admin.css') }}">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <h4 class="brand-title">Maruti Pharmacy</h4>

  <nav class="admin-nav">

    <a href="{{ url_for('admin_panel.dashboard') }}"
       class="nav-link {% if request.endpoint == 'admin_panel.dashboard' %}active{% endif %}">
      <i data-lucide="layout-dashboard" class="nav-icon"></i>
      Dashboard
    </a>

    <a href="{{ url_for('admin_panel.orders') }}"
       class="nav-link {% if 'orders' in request.endpoint %}active{% endif %}">
      <i data-lucide="shopping-cart" class="nav-icon"></i>
      Orders
    </a>

    <a href="{{ url_for('admin_panel.products') }}"
       class="nav-link {% if 'products' in request.endpoint %}active{% endif %}">
      <i data-lucide="package" class="nav-icon"></i>
      Products
    </a>

    <a href="{{ url_for('admin_panel.customers') }}"
       class="nav-link {% if 'customers' in request.endpoint %}active{% endif %}">
      <i data-lucide="users" class="nav-icon"></i>
      Customers
    </a>

    <a href="{{ url_for('admin_panel.invoices') }}"
       class="nav-link {% if 'invoices' in request.endpoint %}active{% endif %}">
      <i data-lucide="file-text" class="nav-icon"></i>
      Invoices
    </a>

    <a href="{{ url_for('admin_panel.reports') }}"
       class="nav-link {% if 'reports' in request.endpoint %}active{% endif %}">
      <i data-lucide="bar-chart-3" class="nav-icon"></i>
      Reports
    </a>

    <div class="divider"></div>

    <a href="{{ url_for('main.home') }}" class="nav-link store-link">
      <i data-lucide="store" class="nav-icon"></i>
      Go to Store
    </a>

    <a href="{{ url_for('auth.logout') }}" class="nav-link logout-link">
      <i data-lucide="log-out" class="nav-icon"></i>
      Logout
    </a>

  </nav>
</aside>

<main class="content">

  <header class="topbar d-flex align-items-center">
    <button class="menu-toggle d-lg-none" onclick="toggleMenu()">
      <i data-lucide="menu"></i>
    </button>

    <h5 class="mb-0 fw-bold">Admin Dashboard</h5>
    <span class="ms-auto text-muted">
      Welcome, {{ current_user.name if current_user.is_authenticated else 'Admin' }}
    </span>
  </header>

  {% block content %}{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }

  document.getElementById('overlay').addEventListener('click', toggleMenu);
  lucide.createIcons();
</script>

</body>
</html>
