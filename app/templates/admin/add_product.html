{% extends "admin/base_admin.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold">Add New Product</h2>

  <a href="{{ url_for('admin_panel.products') }}" class="btn btn-outline-secondary">
    ← Back to Products
  </a>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body p-4">
    <form method="POST" enctype="multipart/form-data">

      <div class="mb-3">
        <label class="form-label fw-semibold">Product Name</label>
        <input
          type="text"
          name="name"
          class="form-control"
          placeholder="e.g. Paracetamol 500mg"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Category</label>
        <input
          type="text"
          name="category"
          class="form-control"
          placeholder="e.g. Pain Relief"
          required
        >
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Price (₹)</label>
          <input
            type="number"
            name="price"
            step="0.01"
            class="form-control"
            placeholder="e.g. 45.00"
            required
          >
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Stock Quantity</label>
          <input
            type="number"
            name="stock"
            class="form-control"
            placeholder="e.g. 100"
            required
          >
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Expiry Date</label>
        <input
          type="date"
          name="expiry_date"
          class="form-control"
        >
        <small class="text-muted">
          Leave empty if not applicable
        </small>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Low Stock Alert Level</label>
        <input
          type="number"
          name="reorder_level"
          class="form-control"
          placeholder="e.g. 10"
          value="10"
          min="0"
        >
        <small class="text-muted">
          Product will be marked as low stock when quantity reaches this value
        </small>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Product Image</label>
        <input
          type="file"
          name="image"
          class="form-control"
          accept="image/*"
          required
        >
        <small class="text-muted">
          Image will be uploaded to <code>static/images/products/</code>
        </small>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Description</label>
        <textarea
          name="description"
          class="form-control"
          rows="4"
          placeholder="Short product description..."
        ></textarea>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('admin_panel.products') }}" class="btn btn-outline-secondary">
          Cancel
        </a>

        <button type="submit" class="btn btn-success px-4">
          Add Product
        </button>
      </div>

    </form>

  </div>
</div>

{% endblock %}
