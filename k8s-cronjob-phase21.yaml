apiVersion: batch/v1
kind: CronJob
metadata:
  name: phase21-kubernetes-cronjob-smoke
  namespace: maruti-pharmacy
  labels:
    app.kubernetes.io/part-of: maruti-pharmacy
    phase: "21"
spec:
  schedule: "*/5 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: phase21-kubernetes-cronjob-smoke
        spec:
          restartPolicy: Never
          containers:
            - name: smoke-test
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  echo "Phase 21 Kubernetes CronJob started"
                  echo "Execution time (UTC):"
                  date -u
                  echo "Phase 21 Kubernetes CronJob completed successfully"
